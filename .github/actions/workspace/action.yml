name: workspace
description: Node, pnpm and the installed workspace. Installing generates the Prisma client.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.17.1

    - uses: actions/setup-node@v4
      with:
        node-version: 22.12
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
