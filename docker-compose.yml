name: appname

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 1s
      timeout: 1s
      retries: 15

  oidc:
    image: wiremock/wiremock:3.9.1
    restart: unless-stopped
    command: ['--disable-banner']
    ports:
      - '${OIDC_PORT}:8080'
    volumes:
      - ./docker/oidc/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/__admin/health']
      interval: 1s
      timeout: 1s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OIDC_JWKS_URL: http://oidc:8080/jwks
    ports:
      - '${API_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      oidc:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:http').get({host:'127.0.0.1',port:3000,path:'/health',agent:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 1s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_OIDC_AUTHORIZE_URL: http://localhost:${OIDC_PORT}/authorize
    restart: unless-stopped
    ports:
      - '${WEB_PORT}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1/healthz']
      interval: 1s
      timeout: 1s
      retries: 15

volumes:
  pgdata:
